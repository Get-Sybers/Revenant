manifest_version: 1

name: "Get-Sybers Revenant"
description: >-
  Resurrect dead-box DFIR and range images into live Proxmox VMs, packaged as a
  Ludus source you can apply and deploy. Revenant takes a forensic scenario —
  starting with Digital Corpora: a disk image, often with a memory dump and
  packet captures alongside — boots the disk back to life as an imported Proxmox
  template, recovers the users and creds on the way in, and when the scenario
  ships pcaps replays them into the range. Ships the scenario blueprints and the
  Revenant task-roles (first-boot fixups, credential reset, pcap replay); the
  resurrected templates are imported with `qm`, not built from ISO with Packer.
authors:
  - "Get-Sybers <99623331+Get-Sybers@users.noreply.github.com>"
homepage: https://github.com/Get-Sybers/Revenant
